name: Publish GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build with public URL
        run: node scripts/build.mjs
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Recover known stalled Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          const endpoint = 'https://api.github.com/repos/ako-develop/hexlet-vibecoding-pages/pages/deployments/77bb9508ebea5974bf61ebbb72b724b538041673';
          const headers = { Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' };
          const response = await fetch(endpoint, { headers });
          if (response.status === 404) {
            console.log('Previous deployment no longer exists.');
          } else {
            if (!response.ok) throw new Error(`Status request failed: ${response.status}`);
            const { status } = await response.json();
            console.log(`Previous deployment status: ${status}`);
            if (!['succeed', 'cancelled'].includes(status)) {
              const cancel = await fetch(`${endpoint}/cancel`, { method: 'POST', headers });
              if (!cancel.ok) throw new Error(`Cancellation failed: ${cancel.status}`);
              console.log('Cancelled stalled deployment.');
              await new Promise(resolve => setTimeout(resolve, 10000));
            }
          }
          JS
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
